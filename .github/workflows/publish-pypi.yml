name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Required for Trusted Publishing (OIDC)


jobs:
  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sys-scan-agent

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build Package (PEP 517)
      run: python -m build
        
        # Find shard files in the extracted wheel
        SHARD_FILES=$(find tmp_wheel -type f -name 'qwen3_analyst.gguf.part.*')
        if [ -z "$SHARD_FILES" ]; then
          echo "❌ CRITICAL FAILURE: No shard files found in wheel."
          exit 1
        fi
        
        # Per-shard size check (<=100MB)
        MAX_SHARD_BYTES=$((100 * 1024 * 1024))
        for f in $SHARD_FILES; do
          size=$(stat -c%s "$f")
          if [ "$size" -gt "$MAX_SHARD_BYTES" ]; then
            echo "❌ CRITICAL FAILURE: Shard $f exceeds 100MB ($size bytes)."
            exit 1
          fi
        done
        
        # Total size sanity check (<=10GB)
        total=0
        for f in $SHARD_FILES; do
          s=$(stat -c%s "$f")
          total=$((total + s))
        done
        echo "Total shards size: $total bytes"
        if [ "$total" -gt $((10 * 1024 * 1024 * 1024)) ]; then
          echo "❌ CRITICAL FAILURE: Total shard size exceeds 10GB ($total)."
          exit 1
        fi
        
        echo "✅ Safety Check Passed: shards included and sizes OK."
    - name: Check Metadata (Twine)
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        # verify_metadata is true by default, ensuring description renders correctly
        verbose: true
