name: Publish Python Package

on:
  release:
    types: [published]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        working-directory: agent
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # For main branch pushes, create a development version
            COMMIT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
            sed -i "s/version='5.0.3'/version='5.0.3.dev${COMMIT_SHA}'/" setup.py
          fi
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: agent/dist/
          skip-existing: true
          print-hash: true