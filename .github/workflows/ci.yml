name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs: 
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build clang-tidy cppcheck libseccomp-dev libcap-dev libbpf-dev linux-tools-common nlohmann-json3-dev
      - name: Configure
        run:  |
          export CC=clang
          export CXX=clang++
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=${{matrix. build_type}} -DBUILD_TESTS=ON -DENABLE_SECCOMP=ON -DENABLE_CAPABILITIES=ON
      - name: Static analysis (clang-tidy)
        run: cmake --build build --target sys_scan_core -- -j$(nproc) && clang-tidy --version || true
      - name: cppcheck
        run: cppcheck --enable=warning,performance,portability --inline-suppr --quiet src || true
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Run tests
        run: cd build && ctest --output-on-failure

  python-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          cd agent
          python -m pip install --upgrade pip
          pip install pytest-timeout pytest-cov
          pip install -r requirements.txt
          pip install -e .
      - name: Run Python tests + coverage
        run: |
          cd agent
          python -m pytest tests/ -v --tb=short --maxfail=5 --timeout=300 \
            --cov=agent --cov-report=xml:../build-cov/agent-coverage.xml --cov-fail-under=85
        env:
          SYS_SCAN_SKIP_CHECK: "1"

  sanitize:
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build build-essential libseccomp-dev libcap-dev libbpf-dev linux-tools-common nlohmann-json3-dev
      - name: Configure (ASan/UBSan)
        run: |
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON -DENABLE_SECCOMP=ON -DENABLE_CAPABILITIES=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build -j$(nproc)
      - name: Tests (sanitizers)
        run: |
          cd build
          ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 UBSAN_OPTIONS=print_stacktrace=1 ctest --output-on-failure || { cat Testing/Temporary/LastTest.log || true; exit 1; }

  coverage:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (dnf)
        run: |
          sudo dnf -y update || true
          sudo dnf -y install cmake ninja-build lcov gcovr python3-pip tar xz curl
      - name: Install Clang 18+ (prebuilt LLVM tarball)
        run: |
          set -euo pipefail
          LLVM_VER=18.0.0
          LLVM_TAR=clang+llvm-${LLVM_VER}-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          LLVM_URL=https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VER}/${LLVM_TAR}
          echo "Downloading LLVM from ${LLVM_URL}"
          curl -sSL ${LLVM_URL} -o /tmp/${LLVM_TAR}
          sudo mkdir -p /opt/clang18
          sudo tar -xJf /tmp/${LLVM_TAR} -C /opt/clang18 --strip-components=1
          sudo chown -R $(id -u):$(id -g) /opt/clang18
          echo "/opt/clang18/bin" | sudo tee /etc/paths.d/clang18 || true
          export PATH=/opt/clang18/bin:$PATH
          clang --version
          CLANG_MAJOR=$(clang --version | head -n1 | sed -E 's/.*version ([0-9]+).*/\1/') || true
          if [ -z "$CLANG_MAJOR" ] || [ "$CLANG_MAJOR" -lt 18 ]; then
            echo "Clang version $CLANG_MAJOR is less than required 18" >&2
            exit 1
          fi
      - name: Configure coverage build
        env:
          CC: clang
          CXX: clang++
        run: |
          export CC=clang
          export CXX=clang++
          cmake -B build-coverage -S . -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DSYS_SCAN_ENABLE_COVERAGE=ON
      - name: Build coverage
        run: cmake --build build-coverage -j$(nproc)
      - name: Run tests
        run: |
          cd build-coverage
          ctest --output-on-failure || true
      - name: Generate coverage report and enforce threshold
        run: |
          cd build-coverage
          # Generate HTML and XML and fail if line coverage < 85
          gcovr -r .. --filter ../src --html --html-details -o coverage.html --xml -o coverage.xml --fail-under-line 85
      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cplusplus-coverage
          path: build-coverage/coverage.html

  fuzz-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on:  ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build build-essential nlohmann-json3-dev
      - name: Configure fuzz harness
        run: |
          cmake -B build -S . -G Ninja -DBUILD_FUZZERS=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
      - name: Build fuzz target
        run: cmake --build build --target fuzz_config -j$(nproc)
      - name: Run fuzz smoke (30s)
        run: |
          if [ -f build/fuzz_config ]; then
            ./build/fuzz_config -max_total_time=30 || true
          fi
