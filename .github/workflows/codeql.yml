name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request: 
    branches: [ main ]
  schedule:
    - cron:  '0 3 * * 0'

jobs:
  analyze:
    runs-on: ubuntu-latest
    container:
      image: debian:stable

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y clang g++ cmake ninja-build \
            libbpf-dev linux-headers-amd64 git \
            python3 python3-pip qtdeclarative5-dev qt5-qmake

      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp, python, qml

      - name: Configure CMake
        run: CC=clang CXX=clang++ cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_CXX_STANDARD=23

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
