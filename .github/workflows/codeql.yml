  container:
  image: debian:stable

    steps:
  - name: Install dependencies
    run: |
      apt-get update
      apt-get install -y clang g++ cmake ninja-build libbpf-dev linux-headers-$(uname -r) git

  - name: Checkout
    uses: actions/checkout@v4

  - name: Configure CMake
    run: CC=clang CXX=clang++ cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_CXX_STANDARD=23

  - name: Build
    run: cmake --build build -j$(nproc)

  - name: Perform CodeQL Analysis
    uses: github/codeql-action/analyze@v3
