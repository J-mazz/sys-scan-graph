[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sys-scan-agent"
version = "7.0.0"
description = "AI-powered intelligence layer for the sys-scan-graph security scanner."
readme = "README.md"
authors = [{ name = "Joseph Mazzini", email = "joseph@mazzlabs.works" }]
maintainers = [{ name = "Joseph Mazzini", email = "joseph@mazzlabs.works" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["security", "scanner", "ai", "intelligence", "analysis", "linux"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<0.13",
    "rich>=13.0,<14",
    "click>=8.1.0,<8.2.0",
    "pyyaml>=6.0,<7",
    "orjson>=3.9,<4",
    "jsonschema>=4.21,<5",
    "PyNaCl>=1.5,<2"
]

[project.optional-dependencies]
ai = [
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "peft>=0.10.0",
    "accelerate>=0.29.0",
    "safetensors>=0.4.0",
    "huggingface_hub>=0.20.0"
]
api = [
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "langchain-anthropic>=0.2,<1"
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<0.24",
    "black>=23.0,<24",
    "isort>=5.12,<6",
    "mypy>=1.5,<2",
    "flake8>=6.0,<7"
]

[project.scripts]
sys-scan-agent = "sys_scan_agent.cli:app"
sys-scan-graph = "sys_scan_agent.cli:app"
sys-scan-intelligence = "sys_scan_agent.cli:app"

[project.urls]
Homepage = "https://github.com/J-mazz/sys-scan-graph"
Repository = "https://github.com/J-mazz/sys-scan-graph"
Issues = "https://github.com/J-mazz/sys-scan-graph/issues"
Documentation = "https://github.com/J-mazz/sys-scan-graph#readme"